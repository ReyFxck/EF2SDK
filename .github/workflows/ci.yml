name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ee-poc:
    name: EF2SDK freestanding PoC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup EF2 bootstrap
        uses: ./.github/actions/setup-ee

      - name: Toolchain info
        run: make toolchain-info

      - name: Build and verify
        run: make clean host-test all check

      - name: Package
        run: make package

      - name: Upload development artifact
        uses: actions/upload-artifact@v7
        with:
          name: EF2SDK-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            build/ef2-boot.elf
            build/ef2-boot.map
            build/libef2.a
            build/ef2audio.irx
          if-no-files-found: error
          retention-days: 14
