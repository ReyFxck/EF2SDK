name: Setup EE bootstrap toolchain
description: Resolve, verify and cache the latest official ps2dev Linux EE toolchain

runs:
  using: composite
  steps:
    - name: Resolve official ps2dev release asset
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        asset="ps2dev-ubuntu-latest.tar.gz"
        metadata="$(curl -fsSL --retry 3 \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/ps2dev/ps2dev/releases/tags/latest)"

        url="$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$metadata")"
        digest="$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .digest' <<<"$metadata")"

        case "$digest" in
          sha256:*) ;;
          *) echo "Unsupported or missing asset digest: $digest" >&2; exit 1 ;;
        esac

        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "sha256=${digest#sha256:}" >> "$GITHUB_OUTPUT"

    - name: Restore EE toolchain cache
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/ef2-ps2dev/ee
        key: ps2dev-ee-${{ runner.os }}-${{ steps.release.outputs.sha256 }}

    - name: Download and verify EE toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TOOLCHAIN_URL: ${{ steps.release.outputs.url }}
        TOOLCHAIN_SHA256: ${{ steps.release.outputs.sha256 }}
      run: |
        set -euo pipefail
        root="${RUNNER_TEMP}/ef2-ps2dev"
        archive="${RUNNER_TEMP}/ps2dev-ubuntu-latest.tar.gz"

        rm -rf "$root"
        mkdir -p "$root"

        curl -fL --retry 3 --retry-all-errors -o "$archive" "$TOOLCHAIN_URL"
        printf '%s  %s\n' "$TOOLCHAIN_SHA256" "$archive" | sha256sum -c -
        tar -xzf "$archive" --strip-components=1 -C "$root"

        test -x "$root/ee/bin/mips64r5900el-ps2-elf-gcc"

        find "$root" -mindepth 1 -maxdepth 1 ! -name ee -exec rm -rf {} +
        rm -f "$archive"

    - name: Export EE toolchain environment
      shell: bash
      run: |
        set -euo pipefail
        root="${RUNNER_TEMP}/ef2-ps2dev"
        test -x "$root/ee/bin/mips64r5900el-ps2-elf-gcc"
        echo "PS2DEV=$root" >> "$GITHUB_ENV"
        echo "$root/ee/bin" >> "$GITHUB_PATH"
