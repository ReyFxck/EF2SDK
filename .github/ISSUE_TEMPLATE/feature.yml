name: Feature proposal
description: Propose an API, subsystem or port
title: "[Proposal] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What PS2 development problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe the API or implementation direction you have in mind.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware considerations
      description: Note any known EE, IOP, GS, SPU2, DMA or compatibility constraints.
