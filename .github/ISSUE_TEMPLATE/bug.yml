name: Bug report
description: Report an EF2SDK bug or hardware compatibility problem
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Real PS2 hardware
        - ARMSX2
        - PCSX2
        - Other emulator
        - Build/CI only
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Include console model, video mode, loader, commit/tag and logs when relevant.
    validations:
      required: true
